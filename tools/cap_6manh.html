.st { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.no { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 500; width: 28px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.st .t1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.st .t1 .zh { font-size: 16px; font-weight: 500; }
.st .t1 .py { font-size: 13px; }
.st .t2 { font-weight: 600; }
.st .t2 .en { font-weight: 400; font-size: 12px; }
.spec { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.spec .num { font-family: var(--font-mono); color: var(--ink); }
.def { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; }
.def .v { font-weight: 600; }

/* =================== MÔ HÌNH 3D =================== */
const stage = document.getElementById('stage');
let scene3d = null;
if (!window.THREE || !THREE.OrbitControls) {
  const f = document.createElement('div'); f.className = 'loadfail';
  f.textContent = 'Không tải được thư viện 3D. Kiểm tra kết nối mạng rồi tải lại trang.';
  stage.appendChild(f);
} else {
  scene3d = build3D();
}

function build3D() {
  const V3 = THREE.Vector3, PI = Math.PI, TAU = PI * 2;
  const RX = 9.3, RZ = 10.4, H = 11.0;            // nửa rộng, nửa dài, chiều cao thân (cm)
  const ARCH_HALF = 0.42, ARCH_H = 5.4;            // khoét gáy: nửa góc, chiều cao (cm)
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.insertBefore(renderer.domElement, stage.firstChild);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 3.0, 1.8);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 20; controls.maxDistance = 200; controls.enablePan = false;
  controls.autoRotate = !reduced; controls.autoRotateSpeed = 1.4;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x7d8594, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(14, 24, 18); scene.add(key);
  const rim = new THREE.DirectionalLight(0xdfe8ff, 0.45); rim.position.set(-18, 8, -16); scene.add(rim);
  const under = new THREE.DirectionalLight(0xffffff, 0.35); under.position.set(0, -20, 6); scene.add(under);

  // Vân vải chéo (twill) vẽ bằng canvas
  const twill = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    g.fillStyle = '#808080'; g.fillRect(0, 0, 64, 64);
    for (let i = -64; i < 128; i += 4) { g.strokeStyle = (i / 4) % 2 ? '#9a9a9a' : '#6a6a6a'; g.lineWidth = 2; g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 64, 64); g.stroke(); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  })();

  const COL = { cap: 0x1f2b47, under: 0x3c5244, board: 0xd8dad5, thread: 0xeee2c8, sweat: 0x4b515b, tape: 0xebe7de, seamtape: 0x8a99b0, buck: 0xf1efe8, metal: 0xb08d57, eyelet: 0x2c3a5e, hole: 0x0b0e14, label: 0xffffff };

  const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
  // ---------- Đăng ký bộ phận ----------
  const REG = {};
  const pickables = [];
  function reg(id, parent, exAll, exSel, anchor, view) {
    const mover = new THREE.Group(); (parent || scene).add(mover);
    REG[id] = { id, mover, mats: [], exAll: exAll || new V3(), exSel: exSel || new V3(), anchor: anchor || new V3(), view };
    return REG[id];
  }
  function fabric(r, color, extra) {
    const m = new THREE.MeshStandardMaterial(Object.assign({ color: lin(color), roughness: 0.93, metalness: 0, side: THREE.DoubleSide, bumpMap: twill, bumpScale: 0.035 }, extra || {}));
    r.mats.push(m); return m;
  }
  function plain(r, opts) { if (typeof opts.color === 'number') opts = Object.assign({}, opts, { color: lin(opts.color) }); const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.6, side: THREE.DoubleSide }, opts)); r.mats.push(m); return m; }
  function addMesh(r, geo, mat, pick) {
    const m = new THREE.Mesh(geo, mat); m.userData.part = r.id; r.mover.add(m);
    if (pick !== false) pickables.push(m); return m;
  }
  const pickMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false });
  function addPick(r, geo) { const m = new THREE.Mesh(geo, pickMat); m.userData.part = r.id; r.mover.add(m); pickables.push(m); return m; }

  // ---------- Hình học ----------
  const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
  function archY(th) {
    const d = angDiff(th, PI); if (Math.abs(d) >= ARCH_HALF) return 0;
    const t = Math.abs(d) / ARCH_HALF; return ARCH_H * Math.sqrt(Math.max(0, 1 - Math.pow(t, 2.6)));
  }
  function vMax(th) { const a = archY(th); return a > 0 ? Math.acos(Math.min(1, a / H)) / (PI / 2) : 1; }
  function crown(th, v, k) {
    k = k || 1; const s = v * PI / 2; const r = Math.pow(Math.sin(s), 0.78);
    return new V3(RX * r * Math.sin(th) * k, H * Math.cos(s) * k, RZ * r * Math.cos(th) * k);
  }
  function crownNormal(th, v) {
    v = Math.max(v, 0.03); const e = 1e-3;
    const dth = crown(th + e, v).sub(crown(th - e, v)); const dv = crown(th, v + e).sub(crown(th, v - e));
    return new V3().crossVectors(dv, dth).normalize();
  }
  function crownTangent(th, v) { const e = 1e-3; return crown(th + e, Math.max(v, 0.03)).sub(crown(th - e, Math.max(v, 0.03))).normalize(); }
  function surface(fn, nu, nv, uvfn) {
    const pos = [], uv = [], idx = [];
    for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
      const u = i / nu, v = j / nv, p = fn(u, v); pos.push(p.x, p.y, p.z);
      const t = uvfn ? uvfn(u, v) : [u, v]; uv.push(t[0], t[1]);
    }
    for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
      const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1; idx.push(a, c, b, b, c, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals(); return g;
  }
  function ribbon(left, right) {
    const pos = [], idx = [], uv = [];
    left.forEach((p, i) => { pos.push(p.x, p.y, p.z, right[i].x, right[i].y, right[i].z); uv.push(i / 6, 0, i / 6, 1); });
    for (let i = 0; i < left.length - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals(); return g;
  }
  const tube = (pts, r, seg) => new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg || pts.length * 2, r, 7, false);
  function stitchMesh(paths, mat, pitch) {
    pitch = pitch || 0.3; const items = [];
    paths.forEach(pts => {
      const segL = []; let total = 0;
      for (let i = 0; i < pts.length - 1; i++) { const l = pts[i].distanceTo(pts[i + 1]); segL.push(l); total += l; }

    spin(on) { controls.autoRotate = on && !reduced; }
  };
  return api;
}

/* =================== NỐI GIAO DIỆN =================== */
renderPartList(); renderSteps(-1); renderPoints();
let stepActive = -1;
function goPoint(i) {
  pointIdx = (i + POINTS.length) % POINTS.length; renderPoints();
  const p = POINTS[pointIdx];
  if (scene3d) scene3d.select(p.parts.flatMap(regsOf), { az: p.az, el: p.el });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-part],[data-reg],[data-step],[data-point],[data-back],#ptPrev,#ptNext');
  if (!t) return;
  if (t.id === 'ptPrev') return goPoint(pointIdx - 1);
  if (t.id === 'ptNext') return goPoint(pointIdx + 1);
  if (t.dataset.back) { scene3d ? scene3d.clear() : renderPartList(); return; }
  if (t.dataset.part) { scene3d ? scene3d.pickKey(t.dataset.part, true) : renderPartDetail(t.dataset.part); return; }
  if (t.dataset.reg) { scene3d ? scene3d.pickReg(t.dataset.reg, true) : renderPartDetail(infoKeyOf(t.dataset.reg), t.dataset.reg); return; }
  if (t.dataset.point) { showTab('points'); goPoint(+t.dataset.point); return; }
  if (t.dataset.step) {
    const i = +t.dataset.step; stepActive = stepActive === i ? -1 : i; renderSteps(stepActive);
    const s = STEPS[i];
    if (!scene3d) return;
    if (stepActive === -1) { scene3d.select([]); return; }
    if (!s.parts.length) { showTab('points'); goPoint(0); return; }
    const regs = s.parts.flatMap(regsOf); const v = scene3d.REG[regs[0]] && scene3d.REG[regs[0]].view;
    scene3d.select(regs, v);
  }
});
const btnExplode = document.getElementById('btnExplode');
btnExplode.addEventListener('click', () => {
  const on = btnExplode.getAttribute('aria-pressed') !== 'true'; btnExplode.setAttribute('aria-pressed', on);
  if (scene3d) { scene3d.explode(on); if (on) scene3d.flyTo(35, 16, 74); }
});
document.getElementById('btnReset').addEventListener('click', () => {
  btnExplode.setAttribute('aria-pressed', 'false'); stepActive = -1; renderSteps(-1);
  if (scene3d) { scene3d.explode(false); scene3d.clear(); scene3d.flyTo(28, 18, 62); }
});
document.getElementById('btnSpin').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on);
  if (scene3d) scene3d.spin(on);
});
document.getElementById('btnInside').addEventListener('click', () => scene3d && scene3d.flyTo(15, -58, 54));
document.getElementById('btnFront').addEventListener('click', () => scene3d && scene3d.flyTo(0, 12, 58));
try { const t = localStorage.getItem('mu6-tab'); if (t && tabs[t] && t !== 'points') showTab(t); } catch (e) {}
</script>
